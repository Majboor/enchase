[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enchase"
version = "2.1.0"
description = "enCHASE: calibration and analysis pipeline for CHASE/HIS solar spectroscopy (TUI + SDK + CLI)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Waleed Ajmal" }]
keywords = ["solar", "CHASE", "HIS", "spectroscopy", "flare", "calibration", "astronomy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "astropy>=5.0",
    "scikit-image>=0.19",
    "opencv-python>=4.5",
    "matplotlib>=3.4",
    "Pillow>=9.0",
    "tqdm>=4.60",
    "requests>=2.25",
    "tomli>=1.2; python_version < '3.11'",
]

[project.optional-dependencies]
tui = ["textual>=0.40"]
portal = ["playwright>=1.40"]
atlas = ["ISPy"]          # FTS-atlas absolute Fe I calibration
dev = ["pytest>=7.0", "pytest-cov"]
all = ["textual>=0.40", "ISPy", "pytest>=7.0"]

[project.scripts]
chase = "chase.cli:main"
chase-tui = "chase.tui:main"
chase-portal = "chase.portal:main"

[project.urls]
Homepage = "https://github.com/Majboor/enchase"
Repository = "https://github.com/Majboor/enchase"
Changelog = "https://github.com/Majboor/enchase/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["chase*", "enchase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
